<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAYA Office - Autonomous AI office with receipts.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0a0805 0%, #1a1410 48%, #0f1419 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      color: #f2e6df;
    }
    .eclipse-bg {
      position: absolute;
      top: -40px;
      right: -80px;
      width: 650px;
      height: 720px;
      background:
        radial-gradient(circle at 55% 42%, rgba(255, 217, 136, 0.22) 0%, rgba(240, 160, 48, 0.12) 24%, rgba(0, 0, 0, 0) 52%),
        radial-gradient(circle at 55% 50%, rgba(10, 10, 15, 0.25) 0%, rgba(0, 0, 0, 0.88) 100%);
      box-shadow: inset -220px 0 320px rgba(0, 0, 0, 0.88);
      opacity: 0.92;
    }
    .accent-line {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(to bottom, #f0a030, #e6a817, transparent);
    }
    .container {
      position: relative;
      z-index: 2;
      width: 690px;
      height: 100%;
      display: flex;
      align-items: center;
      padding: 60px 80px;
    }
    .content {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
    }
    .orb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff8e8 0%, #f0c060 22%, #f0a030 48%, #7d531c 78%, #3a2a12 100%);
      box-shadow: 0 0 24px rgba(240, 160, 48, 0.5), inset 0 0 12px rgba(255, 255, 255, 0.4);
      margin-bottom: 8px;
    }
    h1 {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.08;
    }
    .gold { color: #e6a817; }
    .tagline {
      font-size: 21px;
      color: #a69b91;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.34;
      max-width: 560px;
    }
    .features {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 20px;
      width: 100%;
    }
    .feature-badge {
      background: rgba(230, 168, 23, 0.15);
      border: 1px solid rgba(230, 168, 23, 0.35);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      color: #e6a817;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      backdrop-filter: blur(10px);
    }
    .cta {
      background: #f0a030;
      color: #0a0805;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 800;
      margin-top: 12px;
      letter-spacing: -0.01em;
      box-shadow: 0 8px 24px rgba(240, 160, 48, 0.30);
    }
    footer {
      position: absolute;
      bottom: 24px;
      left: 80px;
      font-size: 11px;
      color: #8a827c;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="eclipse-bg"></div>
  <div class="accent-line"></div>
  <div class="container">
    <div class="content">
      <div class="orb"></div>
      <h1>MAYA<br><span class="gold">Office</span></h1>
      <p class="tagline">Autonomous AI staff, shared context, verified work, and public receipts.</p>
      <div class="features">
        <span class="feature-badge">Staff Initiative</span>
        <span class="feature-badge">Shared World</span>
        <span class="feature-badge">Verified Work</span>
      </div>
      <div class="cta">Explore the office</div>
    </div>
  </div>
  <footer>Powered by 2ndNatureAi</footer>
</body>
</html>
